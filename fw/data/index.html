<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAMI Unimakers 2027</title>
    <style>
        :root { --bg: #f5f5dc; --pan: #fffaf0; --txt: #4a4a4a; --rob: #d2691e; }
        body { font-family: sans-serif; background: var(--bg); color: var(--txt); margin: 0; padding: 10px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; max-width: 1400px; margin-inline: auto; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; max-width: 1400px; margin: auto; }
        
        .panel { background: var(--pan); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; border-top: 5px solid var(--acc, #8b4513); }
        .wide { grid-column: span 1; }
        @media (min-width: 900px) { .wide { grid-column: span 2; } }
        .panel-header { display: flex; justify-content: space-between; border-bottom: 2px solid #e9e4d4; margin-bottom: 12px; font-weight: bold; color: var(--acc, #8b4513); }
        
        .grid-view { width: 100%; aspect-ratio: 2/3; background: #e9e4d4; border: 2px solid var(--acc, #8b4513); position: relative; cursor: crosshair; background-size: 100% 100%; background-repeat: no-repeat; }
        #robot { width: 16px; height: 16px; background: var(--rob); border-radius: 50%; position: absolute; transform: translate(-50%, -50%); border: 2px solid #fff; z-index: 10; transition: 0.1s linear; }
        .waypoint { width: 14px; height: 14px; background: rgba(68, 68, 68, 0.7); color: #fff; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); font-size: 10px; text-align: center; line-height: 14px; }
        .pid-container { display: flex; flex-direction: column; gap: 12px; }
        .slider-row label { display: flex; justify-content: space-between; font-size: 0.85em; font-weight: bold; margin-bottom: 4px; color: var(--acc, #8b4513); }
        .full-slider { width: 100%; accent-color: var(--acc, #8b4513); }
        
        .rainbow-slider {
            width: 100%; height: 14px; border-radius: 7px; outline: none; -webkit-appearance: none; appearance: none;
            background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%); cursor: pointer;
        }
        .rainbow-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #ffffff; border: 2px solid #333333; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .cmd-container { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .arrows { display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(2, 55px); gap: 8px; }
        .btn { background: #d2b48c; border: none; border-radius: 8px; color: var(--acc, #8b4513); font-size: 1.5em; cursor: pointer; height: 55px; font-weight: bold;}
        .shape-btns { display: flex; flex-direction: column; gap: 8px; }
        .btn-s { width: 42px; height: 42px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
        .stats-list { font-size: 0.9em; list-style: none; padding: 0; margin: 0; }
        .stats-list li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: var(--pan); padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }

        .nema-block { background: rgba(0,0,0,0.03); border: 1px solid #e0e0e0; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .nema-block input { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.85em; width: 100%; box-sizing: border-box; }
        .nema-row { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="header-bar">
        <h2>PAMI Unimakers 2027</h2>
        <button class="btn" style="height: 40px; font-size: 1em; padding: 0 15px;" onclick="document.getElementById('settingsModal').style.display='flex'">⚙️ Configurer</button>
    </div>

    <div class="dashboard" id="dash"></div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Personnalisation</h3>
            <div id="settings-form"></div>
            <div style="display:flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                <button class="btn" style="height: 40px; font-size: 1em;" onclick="document.getElementById('settingsModal').style.display='none'">Annuler</button>
                <button class="btn" style="height: 40px; font-size: 1em; background: #27ae60; color: white;" onclick="saveConfig()">Sauvegarder</button>
            </div>
        </div>
    </div>

    <template id="tpl-map">
        <div class="panel wide">
            <div class="panel-header">
                <span>Navigation (2x3m)</span>
                <div style="display:flex; gap:10px; align-items:center;">
                    <label for="bg-up" style="cursor:pointer; font-size:0.7em; background:var(--acc); color:white; padding:3px 8px; border-radius:4px;">Image</label>
                    <input type="file" id="bg-up" accept="image/*" style="display:none" onchange="loadPlan(this)">
                    <span id="pos" style="font-size:0.8em">0.0,0.0</span>
                </div>
            </div>
            <div class="grid-view" id="map" onclick="handleMapClick(event)"><div id="robot"></div></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn" style="flex:2; font-size:0.8em; height:40px;" onclick="sendTraj()">ENVOYER</button>
                <button class="btn" style="flex:1; font-size:0.8em; height:40px; background:#e74c3c; color:white;" onclick="clearTraj()">CLEAR</button>
            </div>
        </div>
    </template>

    <template id="tpl-pid">
        <div class="panel">
            <div class="panel-header"><span>Reglages PID</span></div>
            <div class="pid-container">
                <div class="slider-row"><label>Kp <span id="p_v">1.0</span></label><input type="range" class="full-slider" min="0" max="10" step="0.1" value="1" oninput="sP('p',this.value)"></div>
                <div class="slider-row"><label>Ki <span id="i_v">0.5</span></label><input type="range" class="full-slider" min="0" max="10" step="0.1" value="0.5" oninput="sP('i',this.value)"></div>
                <div class="slider-row"><label>Kd <span id="d_v">0.1</span></label><input type="range" class="full-slider" min="0" max="5" step="0.01" value="0.1" oninput="sP('d',this.value)"></div>
            </div>
        </div>
    </template>

    <template id="tpl-telemetry">
        <div class="panel">
            <div class="panel-header"><span>Telemetrie</span></div>
            <ul class="stats-list">
                <li><span>Batterie</span> <div style="text-align: right;"><span id="dB">12.1</span> V</div></li>
                <li><span>CPU Core 1</span> <div style="text-align: right; color:#e74c3c;"><strong><span id="dC1">0</span> %</strong></div></li>
                <li><span>Enc G</span> <div style="text-align: right;"><span id="dL">0</span> <strong style="color:var(--acc);" id="dAL">(0.0°)</strong></div></li>
                <li><span>Enc D</span> <div style="text-align: right;"><span id="dR">0</span> <strong style="color:var(--acc);" id="dAR">(0.0°)</strong></div></li>
                <li><span>Gyro Z (Vitesse)</span> <div style="text-align: right;"><span id="dGZ">0.00</span> °/s</div></li>
                <li><span>Gyro Z (Absolu)</span> <div style="text-align: right; color:var(--acc);"><strong><span id="dGA">0.00</span> °</strong></div></li>
                <li><span>ToF 1 (Gauche)</span> <div style="text-align: right;" id="dToF1">--</div></li>
                <li><span>ToF 2 (Centre)</span> <div style="text-align: right;" id="dToF2">--</div></li>
                <li><span>ToF 3 (Droite)</span> <div style="text-align: right;" id="dToF3">--</div></li>
                <li><span>ToF 4 (Autre)</span> <div style="text-align: right;" id="dToF4">--</div></li>
            </ul>
        </div>
    </template>

    <template id="tpl-cmd">
        <div class="panel wide">
            <div class="panel-header"><span>Commande Automate</span></div>
            <div class="cmd-container">
                <div class="arrows">
                    <button class="btn" style="grid-column:2" onmousedown="sM(0,1)" onmouseup="sM(0,0)">▲</button>
                    <button class="btn" style="grid-column:1;grid-row:2" onmousedown="sM(-1,0)" onmouseup="sM(0,0)">◀</button>
                    <button class="btn" style="grid-column:2;grid-row:2" onmousedown="sM(0,-1)" onmouseup="sM(0,0)">▼</button>
                    <button class="btn" style="grid-column:3;grid-row:2" onmousedown="sM(1,0)" onmouseup="sM(0,0)">▶</button>
                </div>
                <div class="shape-btns">
                    <button class="btn-s" style="background:#e74c3c;" onclick="sA('X')">X</button>
                    <button class="btn-s" style="background:#3498db;" onclick="sA('O')">O</button>
                    <button class="btn-s" style="background:#f1c40f;" onclick="sA('A')">A</button>
                </div>
                <div style="flex-grow:1; display:flex; flex-direction:column; gap:10px;">
                    <div class="slider-row"><label>Slider 1 <span id="s1_v">50</span></label><input type="range" class="full-slider" min="0" max="100" value="50" oninput="sS(1, this.value)"></div>
                    <div class="slider-row"><label>Slider 2 <span id="s2_v">50</span></label><input type="range" class="full-slider" min="0" max="100" value="50" oninput="sS(2, this.value)"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-manual">
        <div class="panel wide">
            <div class="panel-header"><span>🛠️ Contrôle Manuel Matériel</span></div>
            <div style="display:flex; flex-direction:column; gap:15px;">
                
                <div class="slider-row">
                    <label>Servo 0 (Angle) <span id="val_srv0">90°</span></label>
                    <input type="range" class="full-slider" min="0" max="180" value="90" oninput="document.getElementById('val_srv0').innerText=this.value+'°'; sendCmd('servo', 0, this.value)">
                </div>
                <div class="slider-row">
                    <label>Servo 1 (Angle) <span id="val_srv1">90°</span></label>
                    <input type="range" class="full-slider" min="0" max="180" value="90" oninput="document.getElementById('val_srv1').innerText=this.value+'°'; sendCmd('servo', 1, this.value)">
                </div>

                <div class="slider-row">
                    <label>Moteur DC 1 (Vitesse) <span id="val_dc1">0</span></label>
                    <input type="range" class="full-slider" min="-255" max="255" value="0" oninput="document.getElementById('val_dc1').innerText=this.value; sendCmd('dc', 1, this.value)">
                </div>
                <button class="btn" style="height:35px; font-size:0.9em; background:#e74c3c; color:white; border-radius:5px;" onclick="document.getElementById('val_dc1').innerText='0'; sendCmd('dc', 1, '0')">STOP DC 1</button>

                <div class="slider-row">
                    <label>Moteur DC 2 (Vitesse) <span id="val_dc2">0</span></label>
                    <input type="range" class="full-slider" min="-255" max="255" value="0" oninput="document.getElementById('val_dc2').innerText=this.value; sendCmd('dc', 2, this.value)">
                </div>
                <button class="btn" style="height:35px; font-size:0.9em; background:#e74c3c; color:white; border-radius:5px;" onclick="document.getElementById('val_dc2').innerText='0'; sendCmd('dc', 2, '0')">STOP DC 2</button>

                <!-- CONTRÔLE AVANCÉ NEMA -->
                <div id="nema-controls">
                    <!-- Généré dynamiquement pour NEMA 1, 2, 3 -->
                    <script>
                        for(let i=1; i<=3; i++) {
                            document.write(`
                            <div class="nema-block">
                                <label style="font-size:0.85em; font-weight:bold; color:var(--acc);">NEMA ${i}</label>
                                <div class="nema-row">
                                    <input type="number" id="n${i}_v" placeholder="Vitesse (pas/s)" value="1000" title="Vitesse">
                                    <input type="number" id="n${i}_a" placeholder="Accel (pas/s²)" value="500" title="Accélération">
                                </div>
                                <div class="nema-row">
                                    <button class="btn" style="flex:1; height:35px; font-size:0.85em;" onclick="sendNemaCmd(${i}, 'CONT', 1)">Rot +</button>
                                    <button class="btn" style="flex:1; height:35px; font-size:0.85em;" onclick="sendNemaCmd(${i}, 'CONT', -1)">Rot -</button>
                                    <button class="btn" style="flex:1; height:35px; font-size:0.85em; background:#e74c3c; color:white;" onclick="sendNemaCmd(${i}, 'STOP', 0)">STOP</button>
                                </div>
                                <div class="nema-row">
                                    <input type="number" id="n${i}_p" placeholder="Position (pas)" value="0" style="flex:2;">
                                    <button class="btn" style="flex:1; height:35px; font-size:0.85em; background:#2980b9; color:white;" onclick="sendNemaCmd(${i}, 'POS', 0)">Aller</button>
                                </div>
                            </div>`);
                        }
                    </script>
                </div>

                <!-- CONTROLE NEOPIXEL -->
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <label style="font-size:0.85em; font-weight:bold; color:var(--acc);">NeoPixel :</label>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span id="np_preview" style="display:inline-block; width:18px; height:18px; border-radius:50%; background:#ff0000; border:1px solid #999;"></span>
                            <span id="np_hex" style="font-size:0.85em; font-family:monospace; font-weight:bold;">#FF0000</span>
                        </div>
                    </div>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <input type="range" class="rainbow-slider" min="0" max="360" value="0" style="flex:1;" oninput="updateNeoColor(this.value)">
                        <button class="btn" style="width:65px; height:32px; font-size:0.8em; border-radius:5px; background:#34495e; color:white;" onclick="setNeoOff()">OFF</button>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <template id="tpl-luckfox">
        <div class="panel wide">
            <div class="panel-header"><span>🦊 Gestion Luckfox</span></div>
            <div style="display:flex; flex-direction:column; gap:15px;">
                <div>
                    <label style="font-size:0.85em; font-weight:bold; color:var(--acc);">💬 Console Luckfox :</label>
                    <div style="display:flex; gap:10px; margin-top:5px;">
                        <input type="text" id="luckfox_input" placeholder="" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:5px;">
                        <button class="btn" style="width:100px; height:38px; font-size:0.9em; background:var(--acc); color:white; border-radius:5px;" onclick="sendLuckfox()">Envoyer</button>
                    </div>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #ccc; padding-top: 15px;">
                    <label style="font-size:0.85em; font-weight:bold; color:#2980b9;">📂 Gestionnaire de Fichiers :</label>
                    <div style="display:flex; gap:10px; margin-top:5px;">
                        <button class="btn" style="flex:1; height:35px; font-size:0.85em; background:#2980b9; color:white; border-radius:5px;" onclick="refreshFileList()">🔄 Actualiser la liste</button>
                    </div>
                    <ul id="file_list_container" style="list-style:none; padding:0; margin-top:10px; font-size:0.9em;">
                        <li style="color:#7f8c8d; font-style:italic;">Actualiser pour voir les fichiers.</li>
                    </ul>
                </div>

                <div style="margin-top: 10px; border-top: 1px solid #ccc; padding-top: 15px;">
                    <label style="font-size:0.85em; font-weight:bold; color:#8e44ad;">Flasher le Luckfox (OTA) :</label>
                    <div style="display:flex; gap:10px; margin-top:5px;">
                        <input type="text" id="ota_filename" value="strategy.py" placeholder="Ex: strategy.py" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:5px;">
                    </div>
                    <textarea id="luckfox_code" rows="10" placeholder="Coller le code complet Python ici..." style="width:100%; box-sizing: border-box; font-family:monospace; margin-top:5px; border-radius:5px; padding:8px; border: 1px solid #ccc;"></textarea>
                    <button class="btn" style="width:100%; height:40px; margin-top:8px; background:#8e44ad; color:white; font-size:1em;" onclick="flashLuckfox()">🚀 Transférer le code</button>
                    <div id="ota_status" style="font-size:0.85em; font-weight:bold; margin-top:8px; text-align:center;"></div>
                </div>
            </div>
        </div>
    </template>

    <script>
        const defaultLayout = [
            { id: 'map', name: 'Navigation', show: true, color: '#8b4513' },
            { id: 'telemetry', name: 'Télémétrie', show: true, color: '#2980b9' },
            { id: 'pid', name: 'Réglages PID', show: true, color: '#27ae60' },
            { id: 'cmd', name: 'Contrôleur', show: true, color: '#8e44ad' },
            { id: 'manual', name: 'Contrôle Matériel', show: true, color: '#d35400' },
            { id: 'luckfox', name: 'Gestion Luckfox', show: true, color: '#8e44ad' }
        ];

        let currentConfig = JSON.parse(localStorage.getItem('pamiConfig')) || defaultLayout;

        function renderDashboard() {
            const dash = document.getElementById('dash');
            dash.innerHTML = ''; 
            
            currentConfig.forEach(widget => {
                if(widget.show) {
                    const template = document.getElementById('tpl-' + widget.id);
                    if(template) {
                        const clone = template.content.cloneNode(true);
                        clone.querySelector('.panel').style.setProperty('--acc', widget.color);
                        dash.appendChild(clone);
                    }
                }
            });
            buildSettingsForm();
        }

        function buildSettingsForm() {
            const form = document.getElementById('settings-form');
            form.innerHTML = '';
            currentConfig.forEach((widget, index) => {
                form.innerHTML += `
                    <div class="modal-row">
                        <div>
                            <input type="checkbox" id="chk-${index}" ${widget.show ? 'checked' : ''}>
                            <label for="chk-${index}"><strong>${widget.name}</strong></label>
                        </div>
                        <input type="color" id="col-${index}" value="${widget.color}" style="border:none; width:40px; height:30px; cursor:pointer;">
                    </div>
                `;
            });
        }

        function saveConfig() {
            currentConfig.forEach((widget, index) => {
                widget.show = document.getElementById(`chk-${index}`).checked;
                widget.color = document.getElementById(`col-${index}`).value;
            });
            localStorage.setItem('pamiConfig', JSON.stringify(currentConfig));
            document.getElementById('settingsModal').style.display = 'none';
            renderDashboard(); 
        }

        renderDashboard(); 

        var ws = new WebSocket(`ws://${window.location.hostname}/ws`);
        var pts = [];
        
        ws.onmessage = (e) => {
            var d = JSON.parse(e.data);
            
            if (d.x !== undefined) {
                const elRobot = document.getElementById('robot');
                if(elRobot) {
                    elRobot.style.left = (d.x/2*100)+'%';
                    elRobot.style.top = (100-(d.y/3*100))+'%';
                    document.getElementById('pos').innerText = d.x.toFixed(2) + "," + d.y.toFixed(2);
                }
            }

            if(document.getElementById('dB') && d.b !== undefined) document.getElementById('dB').innerText = d.b.toFixed(1);
            if(d.c1 !== undefined && document.getElementById('dC1')) document.getElementById('dC1').innerText = d.c1;
            
            if(document.getElementById('dL') && d.eL !== undefined) {
                document.getElementById('dL').innerText = d.eL;
                document.getElementById('dAL').innerText = "(" + (d.aL ? d.aL.toFixed(1) : 0.0) + "°)";
            }
            if(document.getElementById('dR') && d.eR !== undefined) {
                document.getElementById('dR').innerText = d.eR;
                document.getElementById('dAR').innerText = "(" + (d.aR ? d.aR.toFixed(1) : 0.0) + "°)";
            }
            if(document.getElementById('dGZ') && d.gz !== undefined) document.getElementById('dGZ').innerText = d.gz.toFixed(2);
            if(document.getElementById('dGA') && d.ga !== undefined) document.getElementById('dGA').innerText = d.ga.toFixed(2);

            for (let i = 1; i <= 4; i++) {
                let el = document.getElementById('dToF' + i);
                if (el && d['tof' + i] !== undefined) {
                    let val = d['tof' + i];
                    if (val < 0 || val === null) {
                        el.innerHTML = '<span style="color:red; font-weight:bold;">Déconnecté</span>';
                    } else {
                        el.innerHTML = val + ' mm';
                    }
                }
            }

            if (d.type === 'file_list' && d.files) {
                updateFileListUI(d.files);
            }
        };

        function loadPlan(i) { if(i.files && i.files[0]) { var r = new FileReader(); r.onload=(e)=>{document.getElementById('map').style.backgroundImage="url('"+e.target.result+"')";}; r.readAsDataURL(i.files[0]); } }
        function handleMapClick(e) {
            if(e.target.id === 'robot') return;
            var r = document.getElementById('map').getBoundingClientRect();
            var px = (e.clientX-r.left)/r.width*2; var py = (1-(e.clientY-r.top)/r.height)*3;
            var idx = pts.findIndex(p => Math.sqrt((p.x-px)**2 + (p.y-py)**2) < 0.15);
            if(idx > -1) pts.splice(idx,1); else pts.push({x:px, y:py});
            drawW();
        }
        function drawW() {
            var m = document.getElementById('map'); m.querySelectorAll('.waypoint').forEach(n => n.remove());
            pts.forEach((p,i) => {
                var d = document.createElement('div'); d.className='waypoint';
                d.style.left=(p.x/2*100)+'%'; d.style.top=(100-(p.y/3*100))+'%'; d.innerText=i+1; m.appendChild(d);
            });
        }
        function sP(t,v){ if(document.getElementById(t+'_v')) document.getElementById(t+'_v').innerText=v; ws.send(JSON.stringify({type:t,value:parseFloat(v)})); }
        function sM(x,y){ ws.send(JSON.stringify({type:'move',x:x,y:y})); }
        function sendTraj(){ ws.send(JSON.stringify({type:'traj',pts:pts})); }
        function clearTraj(){ pts=[]; drawW(); }
        function sA(b){ ws.send(JSON.stringify({type:'action',btn:b})); }
        function sS(id,v){ if(document.getElementById('s'+id+'_v')) document.getElementById('s'+id+'_v').innerText=v; ws.send(JSON.stringify({type:'slider',id:id,val:parseFloat(v)})); }

        function sendCmd(composant, id, valeur) {
            if(ws.readyState === WebSocket.OPEN) {
                let payload = { cmd: composant, id: id, val: String(valeur) };
                ws.send(JSON.stringify(payload));
            }
        }

        // --- NOUVELLE FONCTION NEMA ---
        function sendNemaCmd(id, mode, dir_or_null) {
            let v = document.getElementById('n' + id + '_v').value;
            let a = document.getElementById('n' + id + '_a').value;
            let target = 0;
            
            if (mode === 'CONT') target = dir_or_null;
            else if (mode === 'POS') target = document.getElementById('n' + id + '_p').value;
            
            // Format du payload envoyé : "MODE|VITESSE|ACCEL|CIBLE"
            let payload = `${mode}|${v}|${a}|${target}`;
            sendCmd('nema', id, payload);
        }

        let lastNeoSendTime = 0;
        let pendingNeoTimer = null;

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }

        function updateNeoColor(hue) {
            let hex = hslToHex(parseInt(hue), 100, 50);
            let prev = document.getElementById('np_preview');
            let txt = document.getElementById('np_hex');
            if (prev) prev.style.backgroundColor = hex;
            if (txt) txt.innerText = hex;

            const now = Date.now();
            if (now - lastNeoSendTime >= 50) {
                lastNeoSendTime = now;
                sendCmd('neopixel', 0, hex);
            } else {
                clearTimeout(pendingNeoTimer);
                pendingNeoTimer = setTimeout(() => {
                    lastNeoSendTime = Date.now();
                    sendCmd('neopixel', 0, hex);
                }, 50);
            }
        }

        function setNeoOff() {
            clearTimeout(pendingNeoTimer);
            let prev = document.getElementById('np_preview');
            let txt = document.getElementById('np_hex');
            if (prev) prev.style.backgroundColor = '#000000';
            if (txt) txt.innerText = 'OFF';
            sendCmd('neopixel', 0, 'off');
        }

        function sendLuckfox() {
            let input = document.getElementById('luckfox_input');
            if (input && input.value !== "") {
                sendCmd('luckfox', 0, input.value);
                input.value = ""; 
            }
        }

        function refreshFileList() { sendCmd('luckfox', 0, '<FILE_LIST>'); }
        function deleteRemoteFile(filename) {
            if(confirm("Voulez-vous vraiment supprimer " + filename + " ?")) {
                sendCmd('luckfox', 0, '<FILE_DEL:' + filename + '>');
                setTimeout(refreshFileList, 600);
            }
        }
        function renameRemoteFile(filename) {
            let newName = prompt("Nouveau nom pour " + filename + " :", filename);
            if(newName && newName !== filename) {
                sendCmd('luckfox', 0, '<FILE_REN:' + filename + '|' + newName + '>');
                setTimeout(refreshFileList, 600);
            }
        }
        function updateFileListUI(filesString) {
            let container = document.getElementById('file_list_container');
            if(!container) return;
            let files = filesString.split(',').filter(f => f.trim() !== "");
            if(files.length === 0) {
                container.innerHTML = '<li style="color:#7f8c8d;">Aucun fichier trouvé.</li>';
                return;
            }
            let html = "";
            files.forEach(file => {
                let isProtected = (file === "uart.py");
                html += `<li style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #ddd;">
                    <span style="font-family:monospace; font-weight:bold;">${file} ${isProtected ? '(Cœur)' : ''}</span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn" style="height:28px; font-size:0.75em; padding:0 8px; background:#3498db; color:white;" onclick="renameRemoteFile('${file}')">Renommer</button>
                        ${!isProtected ? `<button class="btn" style="height:28px; font-size:0.75em; padding:0 8px; background:#e74c3c; color:white;" onclick="deleteRemoteFile('${file}')">Supprimer</button>` : ''}
                    </div>
                </li>`;
            });
            container.innerHTML = html;
        }

        async function flashLuckfox() {
            let codeArea = document.getElementById('luckfox_code');
            let statusText = document.getElementById('ota_status');
            let filename = document.getElementById('ota_filename').value;
            if (filename === "") filename = "strategy.py"; 
            if(!codeArea || !statusText) return; 
            let lines = codeArea.value.split('\n'); 
            if(lines.length < 5) { alert("Le code semble trop court !"); return; }
            statusText.style.color = "#d35400"; statusText.innerText = "Initialisation...";
            sendCmd('luckfox', 0, '<OTA_START:' + filename + '>');
            await new Promise(r => setTimeout(r, 40)); 
            for(let i = 0; i < lines.length; i++) {
                statusText.innerText = "Transfert : Ligne " + (i+1) + "/" + lines.length;
                let safeLine = btoa(unescape(encodeURIComponent(lines[i])));
                sendCmd('luckfox', 0, '<OTA_LINE:' + safeLine + '>');
                await new Promise(r => setTimeout(r, 100)); 
            }
            statusText.innerText = "Compilation et redémarrage...";
            sendCmd('luckfox', 0, '<OTA_END>');
            setTimeout(function() {
                statusText.style.color = "#27ae60"; statusText.innerText = "Terminé !";
                codeArea.value = ""; refreshFileList();
            }, 3000);
        }
    </script>
